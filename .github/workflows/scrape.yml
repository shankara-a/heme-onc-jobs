name: Refresh job data

# Re-scrape every job board and commit data/jobs.json.
on:
  schedule:
    - cron: "17 12 * * *"    # daily 12:17 UTC (~5am Pacific)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape job boards
        env:
          # Optional. Add this repo secret to enable the Claude enrichment pass
          # (better clinical/research splits + benefits). Without it, the
          # rule-based extraction runs alone.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.run

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/meta.json data/llm_cache.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh job data [skip ci]"
            # main may have moved while we were scraping (~35 min); replay on top of it
            git pull --rebase -X theirs origin main
            git push
          fi
